<style>
/* 레이아웃: 위에 수집기 상태와 실시간 화면, 아래 지면 필터와 광고 카드 피드. 모바일 1열 → 넓으면 다열 */
:root{
  --bg:#f3f3f1; --card:#ffffff; --fg:#18181b; --sub:#6c6c74; --line:#e2e2de; --chip:#ecebe7;
  --rec:#e0312b; --ok:#13915a; --warn:#c98300;

}
@media (prefers-color-scheme: dark){:root{--bg:#111113;--card:#1b1b1e;--fg:#f1f1f3;--sub:#9b9ba4;--line:#2d2d32;--chip:#26262b;color-scheme:dark}}
*{box-sizing:border-box} [hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
.wrap{max-width:480px;margin:0 auto;display:grid;gap:18px}   /* PC에서도 모바일과 같은 한 줄 화면 */
header{display:grid;gap:10px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tools{display:flex;gap:0;flex-shrink:0}
.brand .word{white-space:nowrap}
@media (max-width:380px){.tool{min-width:36px;padding:6px 3px}.tool small{font-size:10px}}
.hrow .brand{min-width:0}
.tool{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:42px;padding:6px 5px;border-radius:12px;color:var(--fg)}
.tool:hover,.tool:focus-visible{background:var(--chip)}
.tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool small{font-size:10.5px;font-weight:700;color:var(--sub);line-height:1;white-space:nowrap}
.tool.on small{color:var(--fg)}
.tool.on svg{color:#E0312B}
.srow{display:flex;align-items:center;gap:14px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font:600 12px/1 var(--sans);color:var(--sub);white-space:nowrap;overflow:hidden}
.srow b{color:var(--fg);font-family:var(--mono)}
.srow .upd{font-size:11px}
@media (max-width:370px){.srow .upd{display:none}}
.srow .upd{margin-left:auto}
.pcs:empty{display:none}
.pcs{display:flex;align-items:center;gap:5px}.pcs i{width:8px;height:8px;border-radius:50%;background:#2f6fde;display:inline-block}.pcs i.off{background:var(--chip)}
h1{margin:0;font-size:21px;display:flex;align-items:center;gap:8px}
.brand{position:relative;display:flex;align-items:center;gap:10px;line-height:1}
.logo{display:flex;flex-direction:column;gap:6px}
.bw{display:flex;align-items:center;gap:6px;min-height:12px}
.bw .dots{display:inline-flex;gap:3px}.bw .dots i{width:8px;height:8px;border-radius:2px;background:var(--chip);display:inline-block}
.bw .dots i.on{background:var(--ok)}
.more{display:block;margin:6px 0 14px;font-size:13px;color:var(--sub)}
.accbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.accbar button{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:5px 12px;cursor:pointer}
.accbar button.on{background:var(--fg);color:var(--bg)}
.joinlink{font-size:13px;font-weight:700;color:var(--fg)}
#accDlg{max-width:min(420px,94vw)}
.accsheet{padding:20px 20px 22px;display:grid;gap:12px}
.accsheet h2{margin:0;font-size:19px}
.accsheet .x{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--fg)}
.accsheet .x svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;fill:none}

.accsheet .row{display:flex;gap:8px;justify-content:space-between;align-items:center}
.accsheet .tabs button.on{background:var(--fg);color:var(--bg)}
.accsheet .err{color:#d0342c;font-size:13px;min-height:0}.accsheet .err:empty{display:none}

.accsheet .note{font-size:12.5px;color:var(--sub);line-height:1.5}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;z-index:2147483600;font-size:14px}
#toast[hidden]{display:none}
.nothumb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--sub);line-height:1.5}
.nothumb small{font-size:11px;opacity:.8}
.odbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 18px 12px;padding:10px 12px;border-radius:10px;background:var(--chip);font-size:13px;color:var(--sub)}
.odbox button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer}
.gauge{flex:1 1 100%;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.gauge i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .6s ease}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--fg);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.mark{width:clamp(32px,10vw,40px);height:clamp(32px,10vw,40px);display:block}
.word{font-family:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:clamp(28px,9vw,38px);font-weight:400;letter-spacing:-.5px;color:var(--fg);transform:translateY(2px)}
.rec{display:none}
.brand.on .play{animation:playpulse 1.4s ease-in-out infinite;transform-origin:36px 32px}
@keyframes playpulse{50%{opacity:.35}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rec) 45%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--rec) 0%,transparent)}}
@media (prefers-reduced-motion:reduce){.rec.on{animation:none}}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--chip);color:var(--sub)}
.pill.on{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.upd{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--sub)}
.top{display:grid;grid-template-columns:1fr;gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
/* 레트로 PC 목업: 수집기 화면이 브라운관 안에서 돌아가는 느낌만(자세히 보는 용도 아님) */
.panel.live{display:grid;place-items:center;padding:6px 0;background:none;border:none}
.retro{width:min(70%,266px);display:grid;justify-items:center}
.case{width:100%;padding:16px 16px 22px;border-radius:16px 16px 12px 12px;
  background:linear-gradient(160deg,#e6dfcc,#cfc6af 70%,#bdb39a);box-shadow:inset 0 2px 0 #f4efe2,inset 0 -3px 0 #a99f86,0 10px 22px rgba(0,0,0,.18);position:relative}
.bezel{background:#2b2a27;border-radius:14px;padding:12px;box-shadow:inset 0 0 0 3px #3a3834}
.crt{position:relative;aspect-ratio:4/3;border-radius:18px/22px;overflow:hidden;background:#0b120d;
  box-shadow:inset 0 0 28px rgba(0,0,0,.85)}
.crt img{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;object-position:top left;
  filter:saturate(.75) contrast(1.15) brightness(.95);animation:pan 18s ease-in-out infinite alternate}
@keyframes pan{from{transform:translate(0,0) scale(1)}to{transform:translate(-6%,-5%) scale(1.04)}}
/* 옛날 모니터처럼 굵은 가로줄이 위에서 아래로 계속 흘러내림 */
.crt::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.16) 0 36px,rgba(0,0,0,.05) 36px 60px,transparent 60px 108px);
  background-size:100% 108px;animation:roll 3.6s linear infinite}
@keyframes roll{from{background-position:0 0}to{background-position:0 108px}}
.crt::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.55));box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.osd{position:absolute;z-index:5;left:10px;top:8px;font:10px/1 "Silkscreen",var(--mono);color:#ff5b52;letter-spacing:.08em;display:flex;gap:6px;align-items:center}
.osd i{width:7px;height:7px;border-radius:50%;background:#ff3b30;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.ticker{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:5px 10px;background:rgba(0,0,0,.55);
  color:#9dffb5;font:11px/1.3 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nosignal{position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:#050606;color:#8b968f;font:600 13px/1.4 var(--sans,system-ui);letter-spacing:0;text-align:center;padding:0 12px}
.nosignal[hidden]{display:none}
.brandplate{position:absolute;left:22px;bottom:6px;font:700 9px/1 var(--mono);color:#8d846c;letter-spacing:.2em}
.led{position:absolute;right:24px;bottom:8px;width:7px;height:7px;border-radius:50%;background:#7a7262;box-shadow:inset 0 1px 1px rgba(0,0,0,.4)}
.led.on{background:#3ee06b;box-shadow:0 0 6px #3ee06b}
.neck{width:22%;height:16px;background:linear-gradient(#c3b9a0,#b1a78d)}
.foot{width:52%;height:12px;border-radius:6px 6px 10px 10px;background:linear-gradient(#d4ccb6,#b3a98f);box-shadow:0 6px 10px rgba(0,0,0,.15)}
@media (prefers-reduced-motion:reduce){.crt img,.crt::before,.osd i,.brand.on .play{animation:none}}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.board div{background:var(--card);padding:10px 12px}
.board b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.board span{font-size:12px;color:var(--sub)}
.place{margin-top:12px;display:grid;gap:4px;font-size:13.5px}
.place div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:4px 0}
.place b{font-variant-numeric:tabular-nums}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filters button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:5px 12px;cursor:pointer}
.filters button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filters input{flex:1;min-width:180px;font:inherit;padding:7px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
button:focus-visible,input:focus-visible,.ad:focus-visible{outline:2px solid var(--rec);outline-offset:2px}
.feed{display:grid;grid-template-columns:1fr;gap:14px}
.ad{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:grid;min-width:0}
.ad .th{position:relative;background:var(--chip);aspect-ratio:4/3}
.ad .th img{width:100%;height:100%;object-fit:contain;display:block}
.ad .cnt{position:absolute;right:6px;bottom:6px;background:var(--rec);color:#fff;font-size:12px;font-weight:800;padding:1px 7px;border-radius:4px;font-variant-numeric:tabular-nums}
.ad .bd{padding:10px 12px;display:grid;gap:2px;min-width:0}
.ad .pl{justify-self:start;font-size:12px;font-weight:800;color:#fff;background:var(--plc,#555);padding:3px 9px;border-radius:6px;margin-bottom:4px;letter-spacing:-.01em}
.filters .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--plc)}
.p-youtube_instream{--plc:#E0312B}.p-youtube_infeed{--plc:#F08A24}.p-youtube_mobile_instream{--plc:#2F6FE0}.p-youtube_mobile_infeed{--plc:#0E9F9A}.p-youtube_mobile_shorts{--plc:#8A3FD1}
.ad .pl.p-youtube_instream{--plc:#E0312B}.ad .pl.p-youtube_infeed{--plc:#F08A24}
.ad .pl.p-youtube_mobile_instream{--plc:#2F6FE0}.ad .pl.p-youtube_mobile_infeed{--plc:#0E9F9A}.ad .pl.p-youtube_mobile_shorts{--plc:#8A3FD1}
.ad .adv{font-weight:800;overflow-wrap:anywhere}
.ad .ti{font-size:13px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ad .dm{font-family:var(--mono);font-size:11.5px;color:var(--sub);margin-top:4px}
.empty{color:var(--sub);text-align:center;padding:40px 0}
dialog{border:none;border-radius:14px;padding:0;max-width:min(520px,96vw);width:100%;background:var(--card);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.6)}
html,body{touch-action:pan-x pan-y}
input,textarea,select{font-size:16px}
.fb{margin:14px 18px 18px;padding:14px;border:1px dashed var(--line,#444);border-radius:12px}
.fb h3{margin:0 0 8px;font-size:14px}
.fb textarea{width:100%;min-height:72px;box-sizing:border-box;border-radius:8px;border:1px solid var(--line,#444);background:transparent;color:inherit;padding:8px;font:inherit}
.fb button{margin-top:8px}
.fb .note{font-size:12px;color:var(--sub);margin-top:6px}
.cm{font-size:13px;padding:8px 10px;border-radius:8px;background:rgba(127,127,127,.12);margin:6px 0}
.cm small{color:var(--sub);display:block;margin-bottom:2px}
.cm .st{font-weight:700}.cm .st.done{color:#2e9d5b}.cm .st.wait{color:#d08a00}
.fbn{position:absolute;left:6px;top:6px;background:#d08a00;color:#fff;font-size:11px;border-radius:10px;padding:1px 7px}
.sheet{padding:18px;display:grid;gap:14px}
.sheet header button{margin-left:auto;font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:5px 12px;cursor:pointer}
.sheet h2{margin:0;font-size:19px;overflow-wrap:anywhere}
.frames{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.frames.tall{grid-template-columns:repeat(4,minmax(0,1fr))}
.frames figure,.land{margin:0}
.frames img,.land img{width:100%;display:block;border-radius:5px;border:1px solid var(--line);cursor:zoom-in}

dt{color:var(--sub)} dd{margin:0;overflow-wrap:anywhere}
a{color:var(--fg);text-underline-offset:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days span{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:12.5px;font-variant-numeric:tabular-nums}

#zoom[hidden]{display:none!important}
#zoom img{max-width:100%;max-height:100%;object-fit:contain}

.top,.two{grid-template-columns:1fr!important}.frames{grid-template-columns:repeat(2,minmax(0,1fr))!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hrow">
      <h1 class="brand" aria-label="게재나라" id="home" role="link" tabindex="0" title="처음으로" style="cursor:pointer"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true">

let SEARCH = null, searchAt = 0;
const OD = {};   // 불러온 고화질 원본(광고 id → 컷 목록)
const OD_TOPIC = 'gaejab-od-493ef92c7cd1';

async function loadOriginals(a){
  const box = $('#odBox'); if (!box) return;
  const on = DATA && DATA.collector && DATA.collector.running;
  let m = await odManifest(a.id);
  if (!m) {
    if (!on) { box.innerHTML = '<span>지금 PC 수집기가 꺼져 있어 불러올 수 없어요. PC가 켜지면 다시 눌러 주세요.</span>'; return; }

    box.innerHTML = '<span class="spin"></span><span id="odMsg">요청 보내는 중…</span><div class="gauge"><i id="odBar"></i></div>';
    const t0 = Date.now(), since = Math.floor(t0 / 1000) - 5;
    try { const j = await api('/api/od', {ad: String(a.id)}); ACC.me = j.me; renderAcc(); toast(`-${j.cost}P · 원본을 불러올게요`); }

    const STAGE = {sent: [12, 'PC에 요청 보냄 · 응답 기다리는 중'], received: [25, 'PC가 요청을 받았어요'],
                   uploading: [45, 'PC가 고화질 원본을 올리는 중'], pushed: [70, '업로드 완료 · 사이트에 반영되는 중(1분 안팎)']};
    let stage = 'sent', stageAt = Date.now();
    const show = () => {
      const [base, label] = STAGE[stage], next = {sent: 25, received: 45, uploading: 70, pushed: 97}[stage];
      const sec = (Date.now() - stageAt) / 1000, pct = base + (next - base) * (1 - Math.exp(-sec / (stage === 'pushed' ? 45 : 15)));
      const bar = $('#odBar'), msg = $('#odMsg');
      if (bar) bar.style.width = pct.toFixed(1) + '%';
      if (msg) msg.textContent = `${label} · ${Math.round((Date.now() - t0) / 1000)}초`;
    };
    const tick = setInterval(show, 500); show();
    let n = 0;
    while (!m && Date.now() - t0 < 420e3) {
      await new Promise(r => setTimeout(r, 3000));
      if (!$('#dlg').open) { clearInterval(tick); return; }
      try {   // PC 진행 신호 확인
        const t = await fetch(`https://ntfy.sh/${OD_TOPIC}-ack/json?poll=1&since=${since}`).then(r => r.text());
        const order = ['sent', 'received', 'uploading', 'pushed'];
        t.split('\n').forEach(l => { try { const ev = JSON.parse(l); const b = JSON.parse(ev.message || '{}');
          if (String(b.ad) === String(a.id) && order.indexOf(b.stage) > order.indexOf(stage)) { stage = b.stage; stageAt = Date.now(); } } catch(e) {} });
      } catch(e) {}
      if (stage === 'pushed' || ++n % 3 === 0) m = await odManifest(a.id);
    }
    clearInterval(tick);
    if (m && $('#odBar')) { $('#odBar').style.width = '100%'; if ($('#odMsg')) $('#odMsg').textContent = '완료! 불러오는 중…'; }
  }
  if (!m) { if ($('#odBox')) $('#odBox').innerHTML = '<span>시간이 오래 걸리고 있어요. 잠시 뒤 다시 열어 주세요.</span>'; return; }
  if (m.missing || !m.frames.length) { if ($('#odBox')) $('#odBox').innerHTML = '<span>PC에도 이 광고의 원본 컷이 남아 있지 않아요.</span>'; return; }
  await Promise.all(m.frames.map(f => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = f.src; })));
  OD[String(a.id)] = m;
  if ($('#dlg').open) open(a.id);
}

    return;
  }
  // 검색은 그동안 잡은 모든 광고에서 찾음(최근 300개만이 아니라)
  const all = await loadSearch(); if (my !== renderSeq) return;
  const recent = new Map((DATA.ads || []).map(a => [String(a.id), a]));
  const hits = all.filter(a => (!place || a.placement === place) && match(a, k))
    .map(a => recent.get(String(a.id)) || a);
  $('#feed').innerHTML = `<span class="more">전체 ${all.length.toLocaleString()}개 광고 중 ${hits.length.toLocaleString()}개 일치</span>` +
    (hits.slice(0, 300).map(card).join('') || '<p class="empty">일치하는 광고가 없습니다</p>');
}

function open(id){
  let a = (DATA.ads || []).find(x => String(x.id) === String(id));
  if (!a) {   // 오래된 광고: 검색 색인 정보 + 대표 컷만
    const s = (SEARCH || []).find(x => String(x.id) === String(id)); if (!s) return;
    const od = OD[String(id)];
    a = Object.assign({frames: s.thumb ? [{idx: 1, t: 0, src: s.thumb, low: true}] : [], landing: '', daily: [], context_url: '', ad_duration: 0, old: true}, s);
    if (od) { a.frames = od.frames; a.landing = od.landing; a.old = false; a.od = true; }
  }
  $('#sheet').innerHTML = `
    <header><div><div style="color:var(--sub);font-size:12px">${esc(a.label)}</div><h2>${esc(a.advertiser || '광고주 미상')}</h2>
      <div>${esc(a.title)}</div></div><button id="close" type="button">닫기</button></header>
    ${a.old ? `<div class="odbox" id="odBox"><span>오래된 광고라 ${a.frames.length ? '저화질 미리보기 1컷만' : '미리보기 없이 정보만'} 보여요.</span>
      <button type="button" id="odLoad">고화질 원본 불러오기 · 30P</button></div>` : ''}
    ${a.od ? '<p class="more">PC에서 불러온 고화질 원본이에요.</p>' : ''}
    <div class="frames">${a.frames.map(f => `<figure><img loading="lazy" src="${esc(f.src)}" data-z alt=""><figcaption>${f.low ? '저화질 미리보기' : f.idx + '컷' + (f.t ? ' · ' + f.t.toFixed(1) + '초' : '')}</figcaption></figure>`).join('')}</div>
    <div class="two">
      <dl>
        <dt>버튼</dt><dd>${esc(a.cta) || '—'}</dd>
        <dt>랜딩</dt><dd>${a.landing_url ? `<a href="${esc(a.landing_url)}" target="_blank" rel="noopener">${esc(a.landing_url)}</a>` : '—'}</dd>
        <dt>노출 위치</dt><dd>${a.context_url ? `<a href="${esc(a.context_url)}" target="_blank" rel="noopener">${esc(a.context_title || a.context_url)}</a>` : '—'}</dd>
        <dt>광고 길이</dt><dd>${a.ad_duration ? Math.round(a.ad_duration) + '초' : '—'}</dd>
        <dt>처음 확보</dt><dd>${esc(a.first_seen.replace('T',' '))}</dd>
        <dt>마지막 노출</dt><dd>${esc(a.last_seen.replace('T',' '))}</dd>
        <dt>일별 노출</dt><dd><div class="days">${(a.daily || []).map(d => `<span>${d.day.slice(5)} · ${d.n}회</span>`).join('')}</div></dd>
      </dl>
      <figure class="land">${a.landing ? `<img loading="lazy" src="${esc(a.landing)}" data-z alt="랜딩 페이지"><figcaption>랜딩 페이지 (1회 클릭 증빙)</figcaption>` : '<figcaption>랜딩 캡처 없음</figcaption>'}</figure>
    </div>
    <div class="fb"><h3>피드백</h3>
      <div id="fbList">${fbHtml(a.id)}</div>
      <textarea id="fbText" placeholder="이 광고·캡처에 대해 고칠 점을 적어 주세요 (예: 광고주명이 틀림, 제목이 잘림)"></textarea>
      <button type="button" id="fbSend">피드백 등록</button>
      <div class="note" id="fbNote">로그인 없이 바로 등록돼요. 다음 업데이트 때 확인해서 반영하고 '반영 완료'로 바꿔둘게요.</div>
    </div>`;
  $('#dlg').showModal();
  $('#close').onclick = () => $('#dlg').close();
  if ($('#odLoad')) $('#odLoad').onclick = () => loadOriginals(a);
  $('#fbSend').onclick = async () => { const t = $('#fbText').value.trim(); if (!t) { $('#fbText').focus(); return; }
    const btn = $('#fbSend'); btn.disabled = true; btn.textContent = '등록 중…';
    try { await sendFb(a, t); $('#fbText').value = ''; $('#fbList').innerHTML = fbHtml(a.id); $('#fbNote').textContent = '등록됐어요. 확인 후 반영할게요.'; render(); }
    catch(e) { $('#fbNote').textContent = '등록에 실패했어요. 잠시 후 다시 눌러 주세요. (' + e.message + ')'; }
    btn.disabled = false; btn.textContent = '피드백 등록'; };
}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.matches('[data-z]')) { ZL = [...document.querySelectorAll('#sheet [data-z]')].map(i => i.src); zi = Math.max(0, ZL.indexOf(t.src)); zshow(); $('#zoom').hidden = false; return; }
  if (t.closest('#zoom .zp')) { zi = (zi - 1 + ZL.length) % ZL.length; zshow(); return; }
  if (t.closest('#zoom .zn')) { zi = (zi + 1) % ZL.length; zshow(); return; }
  if (t.closest('#zoom')) { $('#zoom').hidden = true; return; }
  const f = t.closest('#filters button'); if (f) { place = f.dataset.p; load(); return; }
  const c = t.closest('.ad'); if (c) open(c.dataset.id);
  if (t === $('#dlg')) $('#dlg').close();
  if (t === $('#accDlg')) $('#accDlg').close();
});
$('#dlg').addEventListener('cancel', e => { if (!$('#zoom').hidden) { e.preventDefault(); $('#zoom').hidden = true; } });
$('#dlg').addEventListener('close', () => { $('#zoom').hidden = true; });
document.addEventListener('keydown', e => {
  if (!$('#zoom').hidden && ZL.length > 1 && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    zi = (zi + (e.key === 'ArrowRight' ? 1 : -1) + ZL.length) % ZL.length; zshow(); }
  if (e.key === 'Enter' && e.target.matches('.ad')) open(e.target.dataset.id);
});
$('#fbAll').onclick = async e => { e.preventDefault(); const t = prompt('게재나라 전체에 대한 피드백을 적어 주세요'); if (!t || !t.trim()) return;
  try { await sendFb(null, t.trim()); alert('등록됐어요. 확인 후 반영할게요.'); } catch(err) { alert('등록에 실패했어요. 잠시 후 다시 시도해 주세요.'); } };
load();
setInterval(load, 60000);

</script>
</body>
</html>
