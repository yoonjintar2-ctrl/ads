<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>게재나라</title>
<meta name="description" content="유튜브 광고 게재 현황을 실시간으로 — 게재나라">
<meta property="og:type" content="website">
<meta property="og:title" content="게재나라">
<meta property="og:description" content="유튜브 광고 게재 현황을 실시간으로">
<meta property="og:url" content="https://ads.jintar.co.kr/">
<meta property="og:image" content="https://ads.jintar.co.kr/og.png?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://ads.jintar.co.kr/og.png?v=2">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500&family=Silkscreen&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 위에 수집기 상태와 실시간 화면, 아래 지면 필터와 광고 카드 피드. 모바일 1열 → 넓으면 다열 */
:root{
  --bg:#f3f3f1; --card:#ffffff; --fg:#18181b; --sub:#6c6c74; --line:#e2e2de; --chip:#ecebe7;
  --rec:#e0312b; --ok:#13915a; --warn:#c98300;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{--bg:#111113;--card:#1b1b1e;--fg:#f1f1f3;--sub:#9b9ba4;--line:#2d2d32;--chip:#26262b;color-scheme:dark}}
*{box-sizing:border-box} [hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:18px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:21px;display:flex;align-items:center;gap:8px}
.brand{position:relative;display:flex;align-items:center;gap:10px;line-height:1}
.mark{width:40px;height:40px;display:block}
.word{font-family:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:38px;font-weight:400;letter-spacing:-.5px;color:var(--fg);transform:translateY(2px)}
.rec{display:none}
.brand.on .play{animation:playpulse 1.4s ease-in-out infinite;transform-origin:36px 32px}
@keyframes playpulse{50%{opacity:.35}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rec) 45%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--rec) 0%,transparent)}}
@media (prefers-reduced-motion:reduce){.rec.on{animation:none}}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--chip);color:var(--sub)}
.pill.on{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.upd{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--sub)}
.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
/* 레트로 PC 목업: 수집기 화면이 브라운관 안에서 돌아가는 느낌만(자세히 보는 용도 아님) */
.panel.live{display:grid;place-items:center;padding:6px 0;background:none;border:none}
.retro{width:min(100%,380px);display:grid;justify-items:center}
.case{width:100%;padding:16px 16px 22px;border-radius:16px 16px 12px 12px;
  background:linear-gradient(160deg,#e6dfcc,#cfc6af 70%,#bdb39a);box-shadow:inset 0 2px 0 #f4efe2,inset 0 -3px 0 #a99f86,0 10px 22px rgba(0,0,0,.18);position:relative}
.bezel{background:#2b2a27;border-radius:14px;padding:12px;box-shadow:inset 0 0 0 3px #3a3834}
.crt{position:relative;aspect-ratio:4/3;border-radius:18px/22px;overflow:hidden;background:#0b120d;
  box-shadow:inset 0 0 28px rgba(0,0,0,.85)}
.crt img{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;object-position:top left;
  filter:saturate(.75) contrast(1.15) brightness(.95);animation:pan 18s ease-in-out infinite alternate}
@keyframes pan{from{transform:translate(0,0) scale(1)}to{transform:translate(-6%,-5%) scale(1.04)}}
/* 옛날 모니터처럼 굵은 가로줄이 위에서 아래로 계속 흘러내림 */
.crt::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.16) 0 36px,rgba(0,0,0,.05) 36px 60px,transparent 60px 108px);
  background-size:100% 108px;animation:roll 3.6s linear infinite}
@keyframes roll{from{background-position:0 0}to{background-position:0 108px}}
.crt::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.55));box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.osd{position:absolute;z-index:5;left:10px;top:8px;font:10px/1 "Silkscreen",var(--mono);color:#ff5b52;letter-spacing:.08em;display:flex;gap:6px;align-items:center}
.osd i{width:7px;height:7px;border-radius:50%;background:#ff3b30;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.ticker{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:5px 10px;background:rgba(0,0,0,.55);
  color:#9dffb5;font:11px/1.3 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nosignal{position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:#0b0d0c;color:#7b8a80;font:12px "Silkscreen",var(--mono);letter-spacing:.15em}
.brandplate{position:absolute;left:22px;bottom:6px;font:700 9px/1 var(--mono);color:#8d846c;letter-spacing:.2em}
.led{position:absolute;right:24px;bottom:8px;width:7px;height:7px;border-radius:50%;background:#7a7262;box-shadow:inset 0 1px 1px rgba(0,0,0,.4)}
.led.on{background:#3ee06b;box-shadow:0 0 6px #3ee06b}
.neck{width:22%;height:16px;background:linear-gradient(#c3b9a0,#b1a78d)}
.foot{width:52%;height:12px;border-radius:6px 6px 10px 10px;background:linear-gradient(#d4ccb6,#b3a98f);box-shadow:0 6px 10px rgba(0,0,0,.15)}
@media (prefers-reduced-motion:reduce){.crt img,.crt::before,.osd i,.brand.on .play{animation:none}}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.board div{background:var(--card);padding:10px 12px}
.board b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.board span{font-size:12px;color:var(--sub)}
.place{margin-top:12px;display:grid;gap:4px;font-size:13.5px}
.place div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:4px 0}
.place b{font-variant-numeric:tabular-nums}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filters button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:5px 12px;cursor:pointer}
.filters button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filters input{flex:1;min-width:180px;font:inherit;padding:7px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
button:focus-visible,input:focus-visible,.ad:focus-visible{outline:2px solid var(--rec);outline-offset:2px}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.ad{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:grid;min-width:0}
.ad .th{position:relative;background:var(--chip);aspect-ratio:4/3}
.ad .th img{width:100%;height:100%;object-fit:contain;display:block}
.ad .cnt{position:absolute;right:6px;bottom:6px;background:var(--rec);color:#fff;font-size:12px;font-weight:800;padding:1px 7px;border-radius:4px;font-variant-numeric:tabular-nums}
.ad .bd{padding:10px 12px;display:grid;gap:2px;min-width:0}
.ad .pl{font-size:11.5px;font-weight:700;color:var(--sub)}
.ad .adv{font-weight:800;overflow-wrap:anywhere}
.ad .ti{font-size:13px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ad .dm{font-family:var(--mono);font-size:11.5px;color:var(--sub);margin-top:4px}
.empty{color:var(--sub);text-align:center;padding:40px 0}
dialog{border:none;border-radius:14px;padding:0;max-width:min(1100px,96vw);width:100%;background:var(--card);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.fb{margin:14px 18px 18px;padding:14px;border:1px dashed var(--line,#444);border-radius:12px}
.fb h3{margin:0 0 8px;font-size:14px}
.fb textarea{width:100%;min-height:72px;box-sizing:border-box;border-radius:8px;border:1px solid var(--line,#444);background:transparent;color:inherit;padding:8px;font:inherit}
.fb button{margin-top:8px}
.fb .note{font-size:12px;color:var(--sub);margin-top:6px}
.cm{font-size:13px;padding:8px 10px;border-radius:8px;background:rgba(127,127,127,.12);margin:6px 0}
.cm small{color:var(--sub);display:block;margin-bottom:2px}
.cm .st{font-weight:700}.cm .st.done{color:#2e9d5b}.cm .st.wait{color:#d08a00}
.fbn{position:absolute;left:6px;top:6px;background:#d08a00;color:#fff;font-size:11px;border-radius:10px;padding:1px 7px}
.sheet{padding:18px;display:grid;gap:14px}
.sheet header button{margin-left:auto;font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:5px 12px;cursor:pointer}
.sheet h2{margin:0;font-size:19px;overflow-wrap:anywhere}
.frames{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.frames.tall{grid-template-columns:repeat(4,minmax(0,1fr))}
.frames figure,.land{margin:0}
.frames img,.land img{width:100%;display:block;border-radius:5px;border:1px solid var(--line);cursor:zoom-in}
figcaption{font-family:var(--mono);font-size:11px;color:var(--sub)}
dl{display:grid;grid-template-columns:88px minmax(0,1fr);gap:6px 10px;margin:0;font-size:14px}
dt{color:var(--sub)} dd{margin:0;overflow-wrap:anywhere}
a{color:var(--fg);text-underline-offset:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days span{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:12.5px;font-variant-numeric:tabular-nums}
dialog#zoom{width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:none;border-radius:0;background:rgba(0,0,0,.97);cursor:zoom-out;overflow:hidden}
dialog#zoom[open]{display:flex;align-items:center;justify-content:center}
dialog#zoom::backdrop{background:rgba(0,0,0,.6)}
#zoom img{max-width:100%;max-height:100%;object-fit:contain}
#zoom .zb{position:absolute;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:22px;width:44px;height:44px;border-radius:50%;cursor:pointer}
#zoom .zx{top:12px;right:12px}#zoom .zp{left:10px;top:50%;transform:translateY(-50%)}#zoom .zn{right:10px;top:50%;transform:translateY(-50%)}
#zoom .zc{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#ddd;font-size:13px}
@media (max-width:820px){.top,.two{grid-template-columns:1fr}.frames{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand" aria-label="게재나라"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <g fill="none" stroke="#E0312B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V9a3 3 0 0 1 3-3h13M42 6h13a3 3 0 0 1 3 3v13M58 42v13a3 3 0 0 1-3 3H42M22 58H9a3 3 0 0 1-3-3V42"/></g>
        <path class="play" d="M25 20.5v23a2 2 0 0 0 3 1.7l19-11.5a2 2 0 0 0 0-3.4l-19-11.5a2 2 0 0 0-3 1.7z" fill="#E0312B"/>
      </svg><span class="word">게재나라</span><span class="rec" id="rec"></span></h1>
    <span class="pill" id="state">불러오는 중</span>
    <span class="upd" id="upd"></span>
    <a class="upd" id="fbAll" href="#" style="color:inherit">💬 전체 피드백 남기기</a>
  </header>

  <section class="top">
    <div class="panel live">
      <div class="retro" aria-label="수집기가 지금 보고 있는 화면">
        <div class="case">
          <div class="bezel">
            <div class="crt">
              <img id="live" alt="">
              <div class="osd"><i></i>REC</div>
              <div class="ticker" id="action">불러오는 중…</div>
              <div class="nosignal" id="nosig" hidden>NO SIGNAL</div>
            </div>
          </div>
          <span class="brandplate">GAEJAE-88</span>
          <span class="led" id="led"></span>
        </div>
        <div class="neck"></div>
        <div class="foot"></div>
      </div>
    </div>
    <div class="panel">
      <div class="board">
        <div><b id="nAds">–</b><span>오늘 노출된 광고</span></div>
        <div><b id="nNew">–</b><span>오늘 신규 확보</span></div>
        <div><b id="nAll">–</b><span>누적 확보</span></div>
      </div>
      <div class="place" id="place"></div>
    </div>
  </section>

  <div class="filters" id="filters"></div>
  <div class="feed" id="feed"></div>
</div>

<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<dialog id="zoom"><img alt="확대 이미지"><button class="zb zx" type="button" aria-label="닫기">✕</button><button class="zb zp" type="button" aria-label="이전">‹</button><button class="zb zn" type="button" aria-label="다음">›</button><div class="zc"></div></dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STATE = {running:'수집 중', paused:'일시정지', waiting:'대기', bot_check:'잠시 휴식', error:'재시작 중', starting:'시작 중', stopped:'꺼짐'};
let DATA = null, place = '', q = '', FRAMES = [], fi = 0, FB = [], ZL = [], zi = 0;
function zshow(){ $('#zoom img').src = ZL[zi] || ''; const many = ZL.length > 1;
  $('#zoom .zp').hidden = $('#zoom .zn').hidden = !many; $('#zoom .zc').textContent = many ? `${zi + 1} / ${ZL.length}` : ''; }
// 확대 화면에서 좌우로 밀어 넘기기
(() => { let x0 = null; document.addEventListener('touchstart', e => { if (e.target.closest('#zoom')) x0 = e.touches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', e => { if (x0 === null || ZL.length < 2) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) { zi = (zi + (dx < 0 ? 1 : -1) + ZL.length) % ZL.length; zshow(); } }, {passive:true}); })();
const REPO = 'yoonjintar2-ctrl/ads';
async function loadFb(){
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/issues?state=all&per_page=100`, {headers:{Accept:'application/vnd.github+json'}});
    if (!r.ok) return;
    FB = (await r.json()).filter(i => !i.pull_request && (i.title || '').startsWith('[피드백]')).map(i => ({ad: ((i.body || '').match(/ad:(\d+)/) || [])[1] || '',
      text: ((i.body || '').split('\n---')[0] || '').trim(), done: i.state === 'closed', at: i.created_at, url: i.html_url, n: i.number}));
    if (DATA) render();
  } catch(e) {}
}
function fbFor(id){ return FB.filter(f => String(f.ad) === String(id)); }
function fbLink(a, text){
  const title = a ? `[피드백] #${a.id} ${(a.advertiser || '').slice(0,30)} · ${a.label}` : '[피드백] 게재나라 전체';
  const body = `${text}\n---\n${a ? `ad:${a.id}\n광고: ${a.advertiser || ''} / ${a.title || ''}\n지면: ${a.label}\n처음 확보: ${a.first_seen}\n` : 'ad:0\n'}사이트: ${location.origin}/`;
  return `https://github.com/${REPO}/issues/new?labels=feedback&title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
}
// 최근 화면들을 번갈아 보여줌(수집기가 돌고 있다는 느낌)
setInterval(() => {
  if (!FRAMES.length || !$('.brand').classList.contains('on')) return;
  fi = (fi + 1) % FRAMES.length; $('#live').src = FRAMES[fi];
}, 1800);

async function load(){
  try {
    const r = await fetch('data/status.json?t=' + Date.now(), {cache:'no-store'});
    DATA = await r.json();
  } catch(e) { $('#state').textContent = '데이터를 불러오지 못했습니다'; return; }
  const c = DATA.collector || {};
  const fresh = DATA.updated_at && (Date.now() - new Date(DATA.updated_at).getTime() < 20*60e3);
  const on = fresh && c.running;
  $('.brand').classList.toggle('on', !!on);
  $('#state').textContent = on ? (STATE[c.state] || '수집 중') : (fresh ? '꺼짐' : '연결 끊김');
  $('#state').className = 'pill ' + (on ? 'on' : 'warn');
  $('#upd').textContent = DATA.updated_at ? DATA.updated_at.slice(5,16).replace('T',' ') + ' 갱신' : '';
  FRAMES = (DATA.live_frames && DATA.live_frames.length ? DATA.live_frames : (DATA.live ? [DATA.live] : []))
    .map(f => f + '?t=' + DATA.updated_at);
  FRAMES.forEach(f => { const im = new Image(); im.src = f; });   // 미리 받아 두기
  if (FRAMES.length && !$('#live').src) $('#live').src = FRAMES[0];
  $('#action').textContent = on ? '▶ ' + (c.action || '수집 중') : '■ 수집기 꺼짐';
  $('#nosig').hidden = !!on; $('#led').className = 'led' + (on ? ' on' : '');
  const t = DATA.today || {};
  $('#nAds').textContent = t.distinct_ads ?? 0; $('#nNew').textContent = t.new_ads ?? 0; $('#nAll').textContent = DATA.total_ads ?? 0;
  $('#place').innerHTML = (DATA.placements || []).map(p => `<div><span>${esc(p.label)}</span><b>${p.ads}개 · 오늘 ${p.today}회</b></div>`).join('');
  $('#filters').innerHTML = `<button data-p="" class="${place===''?'on':''}">전체</button>` +
    (DATA.placements || []).map(p => `<button data-p="${esc(p.key)}" class="${place===p.key?'on':''}">${esc(p.label)}</button>`).join('') +
    `<input id="q" type="search" placeholder="광고주·브랜드·문구 검색" value="${esc(q)}">`;
  $('#q').oninput = e => { q = e.target.value; render(); };
  render();
}

function render(){
  const k = q.trim().toLowerCase();
  const list = (DATA.ads || []).filter(a => (!place || a.placement === place) &&
    (!k || [a.advertiser, a.title, a.landing_domain, a.cta].join(' ').toLowerCase().includes(k)));
  $('#feed').innerHTML = list.map(a => `
    <div class="ad" tabindex="0" data-id="${a.id}">
      <div class="th ${a.tall ? 'tall' : ''}">${a.frames[0] ? `<img loading="lazy" src="${esc(a.frames[0].src)}" alt="">` : ''}
        <span class="cnt" title="오늘 노출 / 누적">${a.seen_today}/${a.seen_total}</span>${fbFor(a.id).length ? `<span class="fbn">💬 ${fbFor(a.id).length}</span>` : ''}</div>
      <div class="bd"><span class="pl">${esc(a.label)}</span>
        <span class="adv">${esc(a.advertiser || '광고주 미상')}</span>
        <span class="ti">${esc(a.title)}</span>
        <span class="dm">${esc(a.landing_domain || '')} · ${esc(a.first_seen.slice(5,16).replace('T',' '))}</span></div>
    </div>`).join('') || '<p class="empty">아직 확보한 광고가 없습니다</p>';
}

function open(id){
  const a = (DATA.ads || []).find(x => String(x.id) === String(id)); if (!a) return;
  $('#sheet').innerHTML = `
    <header><div><div style="color:var(--sub);font-size:12px">${esc(a.label)}</div><h2>${esc(a.advertiser || '광고주 미상')}</h2>
      <div>${esc(a.title)}</div></div><button id="close" type="button">닫기</button></header>
    <div class="frames">${a.frames.map(f => `<figure><img loading="lazy" src="${esc(f.src)}" data-z alt=""><figcaption>${f.idx}컷${f.t ? ' · ' + f.t.toFixed(1) + '초' : ''}</figcaption></figure>`).join('')}</div>
    <div class="two">
      <dl>
        <dt>버튼</dt><dd>${esc(a.cta) || '—'}</dd>
        <dt>랜딩</dt><dd>${a.landing_url ? `<a href="${esc(a.landing_url)}" target="_blank" rel="noopener">${esc(a.landing_url)}</a>` : '—'}</dd>
        <dt>노출 위치</dt><dd>${a.context_url ? `<a href="${esc(a.context_url)}" target="_blank" rel="noopener">${esc(a.context_title || a.context_url)}</a>` : '—'}</dd>
        <dt>광고 길이</dt><dd>${a.ad_duration ? Math.round(a.ad_duration) + '초' : '—'}</dd>
        <dt>처음 확보</dt><dd>${esc(a.first_seen.replace('T',' '))}</dd>
        <dt>마지막 노출</dt><dd>${esc(a.last_seen.replace('T',' '))}</dd>
        <dt>일별 노출</dt><dd><div class="days">${(a.daily || []).map(d => `<span>${d.day.slice(5)} · ${d.n}회</span>`).join('')}</div></dd>
      </dl>
      <figure class="land">${a.landing ? `<img loading="lazy" src="${esc(a.landing)}" data-z alt="랜딩 페이지"><figcaption>랜딩 페이지 (1회 클릭 증빙)</figcaption>` : '<figcaption>랜딩 캡처 없음</figcaption>'}</figure>
    </div>
    <div class="fb"><h3>피드백</h3>
      ${fbFor(a.id).map(f => `<div class="cm"><small><span class="st ${f.done ? 'done' : 'wait'}">${f.done ? '반영 완료' : '반영 대기'}</span> · ${esc(f.at.slice(5,16).replace('T',' '))}</small>${esc(f.text)}</div>`).join('')}
      <textarea id="fbText" placeholder="이 광고·캡처에 대해 고칠 점을 적어 주세요 (예: 광고주명이 틀림, 제목이 잘림)"></textarea>
      <button type="button" id="fbSend">피드백 등록</button>
      <div class="note">GitHub 이슈로 등록돼요(로그인 필요). 다음 업데이트 때 확인해서 반영하고 '반영 완료'로 바꿔둘게요.</div>
    </div>`;
  $('#dlg').showModal();
  $('#close').onclick = () => $('#dlg').close();
  $('#fbSend').onclick = () => { const t = $('#fbText').value.trim(); if (!t) { $('#fbText').focus(); return; }
    window.open(fbLink(a, t), '_blank', 'noopener'); };
}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.matches('[data-z]')) { ZL = [...document.querySelectorAll('#sheet [data-z]')].map(i => i.src); zi = Math.max(0, ZL.indexOf(t.src)); zshow(); $('#zoom').showModal(); return; }
  if (t.closest('#zoom .zp')) { zi = (zi - 1 + ZL.length) % ZL.length; zshow(); return; }
  if (t.closest('#zoom .zn')) { zi = (zi + 1) % ZL.length; zshow(); return; }
  if (t.closest('#zoom')) { $('#zoom').close(); return; }
  const f = t.closest('#filters button'); if (f) { place = f.dataset.p; load(); return; }
  const c = t.closest('.ad'); if (c) open(c.dataset.id);
  if (t === $('#dlg')) $('#dlg').close();
});
document.addEventListener('keydown', e => {
  if ($('#zoom').open && ZL.length > 1 && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    zi = (zi + (e.key === 'ArrowRight' ? 1 : -1) + ZL.length) % ZL.length; zshow(); }
  if (e.key === 'Enter' && e.target.matches('.ad')) open(e.target.dataset.id);
});
$('#fbAll').onclick = e => { e.preventDefault(); const t = prompt('게재나라 전체에 대한 피드백을 적어 주세요'); if (t && t.trim()) window.open(fbLink(null, t.trim()), '_blank', 'noopener'); };
load(); loadFb();
setInterval(load, 60000);
setInterval(loadFb, 300000);
</script>
</body>
</html>
